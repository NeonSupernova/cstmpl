# .github/workflows/release.yml
name: Cross-platform Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          rustup target add x86_64-pc-windows-gnu

      - name: Build release
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo build --release --target x86_64-unknown-linux-gnu
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cargo build --release --target x86_64-apple-darwin
            cargo build --release --target aarch64-apple-darwin
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            cargo build --release --target x86_64-pc-windows-gnu
          fi

      - name: Package binaries
        run: |
          mkdir -p release
          cp target/*/release/cstmpl* release/ || true

      - name: Sign binaries (placeholder)
        run: |
          echo "Sign binaries here using platform-specific tools"

      - name: Build installers
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            # Create .deb (requires dpkg-deb)
            mkdir -p deb_package/usr/local/bin
            cp target/x86_64-unknown-linux-gnu/release/cstmpl deb_package/usr/local/bin/
            cp README.md deb_package/
            dpkg-deb --build deb_package cstmpl.deb
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            # Create DMG
            mkdir -p dmg_temp
            cp target/*-apple-darwin/release/cstmpl dmg_temp/
            cp README.md dmg_temp/
            hdiutil create -volname cstmpl -srcfolder dmg_temp -ov -format UDZO cstmpl.dmg
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            # Create Inno Setup installer (requires ISCC)
            echo "Build Inno Setup installer here"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/